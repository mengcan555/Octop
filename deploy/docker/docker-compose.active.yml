# =============================================================================
# Teacherbuddy — Docker Compose（国内镜像）
#
#
# 用法（在仓库根目录执行）:
#   docker compose -f docker/docker-compose.cn.yml up -d
#   TEACHER_PORT=9090 docker compose -f docker/docker-compose.cn.yml up -d
#   TEACHER_DEFAULT_PASSWORD=<your-strong-password> docker compose -f docker/docker-compose.cn.yml up -d
#
# 环境变量与 docker-compose.yml 相同。docker/.env 仅用于 Compose 插值；
# 变量必须列在下方 environment 才会进入容器。
# =============================================================================

services:
  
  postgres:
    image: 172.18.190.33:8088/infra/postgres:15-alpine
    container_name: teacherbuddy-postgres
    restart: unless-stopped
    ports:
      - "${TEACHER_PORT:-5432}:5432"
    environment:
      TEACHER_DATABASE_URL: ${TEACHER_DATABASE_URL:-}
      TEACHER_DATABASE_HOST: ${TEACHER_DATABASE_HOST:-}
      POSTGRES_USER: ${TEACHER_DATABASE_USER:-teacherbuddy}
      POSTGRES_PASSWORD: ${TEACHER_DATABASE_PASSWORD:-teacherbuddy}
      POSTGRES_DB: ${TEACHER_DATABASE_NAME:-teacherbuddy}
    volumes:
      - ${TEACHER_DATA}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
  teacherbuddy:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile_active
    image: teacherbuddy:latest
    container_name: teacherbuddy
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    # Xvnc needs more than Docker's default 64MB /dev/shm after the user enables the desktop.
    shm_size: "1gb"
    ports:
      - "${TEACHER_PORT:-8088}:${TEACHER_PORT:-8088}"
    volumes:
      - ${TEACHER_DATA:-~/.teacherbuddy}:/data/.teacherbuddy
    environment:
      - HOME=/data
      - TEACHER_BIND_HOST=0.0.0.0
      - TEACHER_PORT=${TEACHER_PORT:-8088}
      - TEACHER_LOG_LEVEL=${TEACHER_LOG_LEVEL:-info}
      - TEACHER_DEFAULT_PASSWORD=${TEACHER_DEFAULT_PASSWORD:-}
      - TEACHER_ADMIN_USERNAME=${TEACHER_ADMIN_USERNAME:-admin}
      - TEACHER_ADMIN_DISPLAY_NAME=${TEACHER_ADMIN_DISPLAY_NAME:-Admin}
      - TEACHER_DATABASE_URL=${TEACHER_DATABASE_URL:-}
      - TEACHER_DATABASE_DRIVER=${TEACHER_DATABASE_DRIVER:-}
      - TEACHER_DATABASE_SQLITE_PATH=${TEACHER_DATABASE_SQLITE_PATH:-}
      - TEACHER_DATABASE_HOST=${TEACHER_DATABASE_HOST:-}
      - TEACHER_DATABASE_PORT=${TEACHER_DATABASE_PORT:-}
      - TEACHER_DATABASE_NAME=${TEACHER_DATABASE_NAME:-}
      - TEACHER_DATABASE_USER=${TEACHER_DATABASE_USER:-}
      - TEACHER_DATABASE_PASSWORD=${TEACHER_DATABASE_PASSWORD:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-}
      - LANGFUSE_TRACING_ENABLED=${LANGFUSE_TRACING_ENABLED:-true}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - LANGFUSE_BASE_URL=${LANGFUSE_BASE_URL:-}
